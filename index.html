<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>ভুতুড়ে অভিযান (Ghostly Quest)</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 2px solid #444;
      border-radius: 15px;
      background-image: linear-gradient(to bottom, #111, #222);
    }
    h1 {
      text-align: center;
      color: #f39c12;
    }
    #story {
      white-space: pre-wrap;
      margin-bottom: 20px;
      min-height: 150px;
    }
    button {
      margin: 5px;
      padding: 10px 20px;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #666;
    }
  </style>
</head>
<body>
  <h1>ভুতুড়ে অভিযান 👻</h1>
  <div id="story">লোড হচ্ছে...</div>
  <div>
    <button id="btn1">পছন্দ ১</button>
    <button id="btn2">পছন্দ ২</button>
  </div>

  <script>
    let storyIndex = 0;

    const storyEl = document.getElementById("story");
    const btn1 = document.getElementById("btn1");
    const btn2 = document.getElementById("btn2");

    const updateStory = () => {
      if (storyIndex === 0) {
        storyEl.innerText = "🌘 রাত গভীর, তুমি ঢুকেছো পুরনো এক শ্মশানে...\nহঠাৎ একটা আওয়াজ — কিঃ কিঃ কিঃ!";
        btn1.innerText = "আওয়াজের দিকে যাও";
        btn2.innerText = "পালিয়ে যাও";
      } else if (storyIndex === 1) {
        storyEl.innerText = "👻 এক পেত্নি তোমার সামনে এসে দাঁড়ালো!";
        btn1.innerText = "কথা বলো";
        btn2.innerText = "দৌড়াও";
      } else if (storyIndex === 2) {
        storyEl.innerText = "পেত্নি বললো: 'ভয় পেও না, আমি তোমার বন্ধু!'\n🎉 তোমরা গল্প করতে করতে বন্ধু হয়ে গেলে।";
        endGame(true);
      } else if (storyIndex === 3) {
        storyEl.innerText = "তুমি দৌড়ে পালালে, পিছলে পড়ে গেলে কাদা জলে!\n👻 পেত্নি হেসে হেসে গায়েব হয়ে গেল!";
        endGame(false);
      } else if (storyIndex === 4) {
        storyEl.innerText = "😱 হঠাৎ ঘাড় ঘুরিয়ে দেখলে — এক সাদা কাপড় পরা ভূত তোমার পিছনে দাঁড়িয়ে!\nতুমি চিৎকার করে জ্ঞান হারালে!";
        endGame(false);
      }
    };

    const endGame = (win) => {
      btn1.disabled = true;
      btn2.disabled = true;
      setTimeout(() => {
        alert(win ? "অভিনন্দন! তুমি বেঁচে গেছো!" : "গেম ওভার! আবার চেষ্টা করো!");
      }, 300);
    };

    btn1.onclick = () => {
      if (storyIndex === 0) {
        storyIndex = 1;
      } else if (storyIndex === 1) {
        storyIndex = 2;
      }
      updateStory();
    };

    btn2.onclick = () => {
      if (storyIndex === 0) {
        storyIndex = 4;
      } else if (storyIndex === 1) {
        storyIndex = 3;
      }
      updateStory();
    };

    // Start game
    updateStory();
  </script>
</body>
</html>
