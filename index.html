<!DOCTYPE html>
<html>
<head>
  <title>Ghost Shooter</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #111;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

let keys = {};
let bullets = [];
let enemies = [];
let enemyBullets = [];
let score = 0;
let health = 3;

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

class Player {
  constructor() {
    this.width = 50;
    this.height = 50;
    this.x = canvas.width / 2 - this.width / 2;
    this.y = canvas.height - this.height - 20;
    this.speed = 6;
  }

  draw() {
    ctx.fillStyle = "cyan";
    ctx.fillRect(this.x, this.y, this.width, this.height);
  }

  move() {
    if (keys["ArrowLeft"] && this.x > 0) this.x -= this.speed;
    if (keys["ArrowRight"] && this.x + this.width < canvas.width) this.x += this.speed;
  }

  shoot() {
    bullets.push(new Bullet(this.x + this.width/2, this.y));
  }
}

class Bullet {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.speed = 8;
    this.size = 5;
  }

  draw() {
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }

  update() {
    this.y -= this.speed;
  }
}

class Enemy {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = 40;
    this.speed = 1 + Math.random()*2;
  }

  draw() {
    ctx.fillStyle = "red";
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }

  update() {
    this.y += this.speed;
    if (Math.random() < 0.01) {
      enemyBullets.push(new EnemyBullet(this.x + this.size/2, this.y + this.size));
    }
  }
}

class EnemyBullet {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.size = 5;
    this.speed = 4;
  }

  draw() {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
  }

  update() {
    this.y += this.speed;
  }
}

const player = new Player();

function spawnEnemy() {
  const x = Math.random() * (canvas.width - 40);
  enemies.push(new Enemy(x, -40));
}
setInterval(spawnEnemy, 1000);

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw player
  player.move();
  player.draw();

  // Draw bullets
  bullets.forEach((b, i) => {
    b.update();
    b.draw();
    if (b.y < 0) bullets.splice(i, 1);
  });

  // Draw enemies
  enemies.forEach((e, ei) => {
    e.update();
    e.draw();

    bullets.forEach((b, bi) => {
      if (b.x > e.x && b.x < e.x + e.size && b.y > e.y && b.y < e.y + e.size) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
        score++;
      }
    });

    if (e.y + e.size > canvas.height) enemies.splice(ei, 1);
  });

  // Enemy bullets
  enemyBullets.forEach((eb, ei) => {
    eb.update();
    eb.draw();
    if (eb.y > canvas.height) enemyBullets.splice(ei, 1);
    if (
      eb.x > player.x && eb.x < player.x + player.width &&
      eb.y > player.y && eb.y < player.y + player.height
    ) {
      health--;
      enemyBullets.splice(ei, 1);
      if (health <= 0) {
        alert("Game Over! স্কোর: " + score);
        location.reload();
      }
    }
  });

  // UI
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 20, 30);
  ctx.fillText("Health: " + health, 20, 60);

  requestAnimationFrame(animate);
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") player.shoot();
});

animate();
</script>
</body>
</html>
